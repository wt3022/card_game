syntax = "proto3";

package cardgame.v1;

option go_package = "card_game/api/gen/proto/cardgame/v1;cardgamev1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// 共通メッセージ定義

// カードタイプ
enum CardType {
  CARD_TYPE_UNSPECIFIED = 0;
  CARD_TYPE_UNIT = 1;
  CARD_TYPE_SPELL = 2;
  CARD_TYPE_LEADER = 3;
}

// 特性
enum Trait {
  TRAIT_UNSPECIFIED = 0;
  TRAIT_RUSH = 1;           // 疾走: 場に出たターンにユニット・リーダーに攻撃できる
  TRAIT_CHARGE = 2;         // 突進: 場に出たターンにユニットにのみ攻撃できる
  TRAIT_WINDFURY = 3;       // 疾風: 1ターンに2回攻撃可能
  TRAIT_PIERCE = 4;         // 貫通: 余剰ダメージがプレイヤーに貫通
  TRAIT_GUARDIAN = 5;       // 守護: 相手はこのユニットを攻撃しなければならない
  TRAIT_EFFECT_SHIELD = 6;  // 効果盾: 効果によるダメージを受けない
  TRAIT_UNTARGETABLE = 7;   // 対象不可: 効果の対象にならない
}

// ゲームフェイズ
enum GamePhase {
  GAME_PHASE_UNSPECIFIED = 0;
  GAME_PHASE_TURN_START = 1;
  GAME_PHASE_DRAW = 2;
  GAME_PHASE_RESOURCE_GAIN = 3;
  GAME_PHASE_MAIN = 4;
  GAME_PHASE_TURN_END = 5;
}

// 効果発動タイミング
enum EffectTiming {
  EFFECT_TIMING_UNSPECIFIED = 0;
  EFFECT_TIMING_IMMEDIATE = 1;      // 即座に発動
  EFFECT_TIMING_ON_SUMMON = 2;      // 召喚時
  EFFECT_TIMING_ON_DESTROY = 3;     // 破壊時
  EFFECT_TIMING_ON_ATTACK = 4;      // 攻撃時
  EFFECT_TIMING_ON_DAMAGED = 5;     // ダメージを受けた時
  EFFECT_TIMING_TURN_START = 6;     // ターン開始時
  EFFECT_TIMING_TURN_END = 7;       // ターン終了時
}

// カード効果タイプ
enum AtomicEffectType {
  ATOMIC_EFFECT_TYPE_UNSPECIFIED = 0;
  ATOMIC_EFFECT_TYPE_DEAL_DAMAGE = 1;
  ATOMIC_EFFECT_TYPE_DEAL_SPLASH = 2;
  ATOMIC_EFFECT_TYPE_RESTORE_HP = 3;
  ATOMIC_EFFECT_TYPE_RESTORE_MANA = 4;
  ATOMIC_EFFECT_TYPE_FULL_RESTORE = 5;
  ATOMIC_EFFECT_TYPE_DRAW_CARD = 6;
  ATOMIC_EFFECT_TYPE_DISCARD_CARD = 7;
  ATOMIC_EFFECT_TYPE_SEARCH_CARD = 8;
  ATOMIC_EFFECT_TYPE_SHUFFLE_DECK = 9;
  ATOMIC_EFFECT_TYPE_MODIFY_ATTACK = 10;
  ATOMIC_EFFECT_TYPE_MODIFY_DEFENSE = 11;
  ATOMIC_EFFECT_TYPE_MODIFY_COST = 12;
  ATOMIC_EFFECT_TYPE_MODIFY_MAX_HP = 13;
  ATOMIC_EFFECT_TYPE_SUMMON_UNIT = 14;
  ATOMIC_EFFECT_TYPE_DESTROY_UNIT = 15;
  ATOMIC_EFFECT_TYPE_RETURN_TO_HAND = 16;
  ATOMIC_EFFECT_TYPE_RETURN_TO_DECK = 17;
  ATOMIC_EFFECT_TYPE_DISABLE_UNIT = 18;
  ATOMIC_EFFECT_TYPE_GRANT_TRAIT = 19;
  ATOMIC_EFFECT_TYPE_REMOVE_TRAIT = 20;
  ATOMIC_EFFECT_TYPE_GAIN_MANA = 21;
  ATOMIC_EFFECT_TYPE_REDUCE_COST = 22;
}

// ターゲット対象タイプ
enum TargetType {
  TARGET_TYPE_UNSPECIFIED = 0;
  TARGET_TYPE_SELF = 1;
  TARGET_TYPE_ENEMY_LEADER = 2;
  TARGET_TYPE_ALLY_LEADER = 3;
  TARGET_TYPE_ENEMY_UNIT = 4;
  TARGET_TYPE_ALLY_UNIT = 5;
  TARGET_TYPE_ALL_UNITS = 6;
  TARGET_TYPE_ALL_ENEMY_UNITS = 7;
  TARGET_TYPE_ALL_ALLY_UNITS = 8;
  TARGET_TYPE_RANDOM_ENEMY_UNIT = 9;
  TARGET_TYPE_RANDOM_ALLY_UNIT = 10;
}

// 効果チェーンノードタイプ
enum EffectChainNodeType {
  EFFECT_CHAIN_NODE_TYPE_UNSPECIFIED = 0;
  EFFECT_CHAIN_NODE_TYPE_THEN = 1;      // 順次実行
  EFFECT_CHAIN_NODE_TYPE_AND = 2;       // 並列実行
  EFFECT_CHAIN_NODE_TYPE_IF_ELSE = 3;   // 条件分岐
  EFFECT_CHAIN_NODE_TYPE_REPEAT = 4;    // 繰り返し
  EFFECT_CHAIN_NODE_TYPE_FOREACH = 5;   // 反復
}

// 原子効果
message AtomicEffect {
  uint32 id = 1;
  AtomicEffectType type = 2;
  optional TargetSelector target = 3;
  optional int32 value = 4;
  optional string card_id = 5;
  optional Trait trait = 6;
  EffectTiming timing = 7;  // 発動タイミング
  optional google.protobuf.Struct parameters = 8;  // 追加パラメータ (name, attack, defense, cost, count, traitsなど)
}

// ターゲットセレクター
message TargetSelector {
  uint32 id = 1;
  TargetType type = 2;
  optional ConditionFilter filter = 3;
}

// 条件フィルター
message ConditionFilter {
  uint32 id = 1;
  string condition_type = 2;  // "HAS_TRAIT", "ATTACK_RANGE", "DEFENSE_RANGE", etc.
  repeated string parameters = 3;
}

// 効果チェーンノード
message EffectChainNode {
  uint32 id = 1;
  EffectChainNodeType type = 2;
  optional AtomicEffect atomic_effect = 3;
  optional EffectChainNode next = 4;           // THEN用
  repeated EffectChainNode children = 5;       // AND用
  optional EffectChainNode then_node = 6;      // IF_ELSE用
  optional EffectChainNode else_node = 7;      // IF_ELSE用
  optional ConditionFilter condition = 8;      // IF_ELSE用
  optional EffectChainNode repeat_effect = 9;  // REPEAT用
  optional int32 repeat_count = 10;            // REPEAT用
  optional EffectChainNode foreach_effect = 11; // FOREACH用
  optional TargetSelector foreach_target = 12;  // FOREACH用
}

// 効果定義
message EffectDefinition {
  uint32 id = 1;
  bool require_target = 2;
  optional EffectChainNode root = 3;
}

// カード効果
message CardEffect {
  uint32 id = 1;
  string card_id = 2;
  repeated EffectDefinition definitions = 3;
}

// カード
message Card {
  string id = 1;
  string name = 2;
  CardType type = 3;
  int32 cost = 4;
  optional int32 attack = 5;
  optional int32 defense = 6;
  string effect = 7;
  repeated Trait traits = 8;
  optional CardEffect card_effect = 9; // カード管理UI向けの効果定義(型安全)
  string instance_id = 10; // ゲーム内での一意なインスタンスID
}

// ユニット
message Unit {
  string card_id = 1;
  string instance_id = 2;
  string name = 3;
  int32 cost = 4;
  int32 attack = 5;
  int32 defense = 6;
  int32 current_defense = 7;
  repeated Trait traits = 8;
  string effect = 9;
  int32 attacks_remaining = 10;  // 残り攻撃回数（Windfury対応）
  bool summoned_this_turn = 11;
  string owner_id = 12;
}

// プレイヤー
message Player {
  string id = 1;
  string name = 2;
  int32 hp = 3;
  int32 max_hp = 4;
  int32 current_turn_mana = 5;
  int32 current_recovery_mana = 6;
  int32 hand_count = 7;
  int32 deck_count = 8;
  int32 graveyard_count = 9;
  repeated Unit field = 10;
  int32 time_remaining_seconds = 11;
  repeated Card hand = 12;  // 自分のプレイヤーの場合のみ含まれる
  bool is_connected = 13;  // 接続状態
  google.protobuf.Timestamp last_activity_at = 14;  // 最後のアクティビティ時刻
}

// ゲーム状態
message GameState {
  string game_id = 1;
  Player player1 = 2;
  Player player2 = 3;
  string current_player_id = 4;
  int32 current_turn = 5;
  GamePhase current_phase = 6;
  bool is_game_over = 7;
  optional string winner_id = 8;
  bool is_draw = 9;
  bool player1_mulligan_done = 10;  // プレイヤー1がマリガンを完了したか
  bool player2_mulligan_done = 11;  // プレイヤー2がマリガンを完了したか
  bool coin_toss_done = 12;  // コイントスが完了したか
  optional string coin_toss_winner_id = 13;  // コイントスの勝者
  bool turn_order_decided = 14;  // 先攻後攻が決定したか
}

// イベント
message GameEvent {
  string game_id = 1;
  int32 turn = 2;
  string phase = 3;
  string event_type = 4;
  string player_id = 5;
  string details = 6;
  google.protobuf.Timestamp timestamp = 7;
}

// デッキ
message Deck {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string card_ids = 4;
  string user_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
