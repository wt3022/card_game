syntax = "proto3";

package cardgame.v1;

option go_package = "card_game/api/gen/proto/cardgame/v1;cardgamev1";

import "common.proto";

// カード管理サービス
service CardManagementService {
  rpc CreateCard(CreateCardRequest) returns (CreateCardResponse);
  rpc GetCard(GetCardRequest) returns (GetCardResponse);
  rpc ListCards(ListCardsRequest) returns (ListCardsResponse);
  rpc UpdateCard(UpdateCardRequest) returns (UpdateCardResponse);
  rpc DeleteCard(DeleteCardRequest) returns (DeleteCardResponse);
  
  rpc CreateDeck(CreateDeckRequest) returns (CreateDeckResponse);
  rpc GetDeck(GetDeckRequest) returns (GetDeckResponse);
  rpc ListDecks(ListDecksRequest) returns (ListDecksResponse);
  rpc UpdateDeck(UpdateDeckRequest) returns (UpdateDeckResponse);
  rpc DeleteDeck(DeleteDeckRequest) returns (DeleteDeckResponse);
}

// カード作成リクエスト
message CreateCardRequest {
  optional string id = 1; // 未指定の場合はバックエンドで自動生成
  string name = 2;
  CardType type = 3;
  int32 cost = 4;
  optional int32 attack = 5;
  optional int32 defense = 6;
  string effect_text = 7;
  repeated Trait traits = 8;
  optional CardEffect card_effect = 9; // CardEffectModel構造を型安全に送信
}

// カード作成レスポンス
message CreateCardResponse {
  Card card = 1;
}

// カード取得リクエスト
message GetCardRequest {
  string id = 1;
}

// カード取得レスポンス
message GetCardResponse {
  Card card = 1;
}

// カード一覧リクエスト
message ListCardsRequest {
  optional CardType type = 1; // 指定された場合、そのタイプのみ取得
}

// カード一覧レスポンス
message ListCardsResponse {
  repeated Card cards = 1;
}

// カード更新リクエスト
message UpdateCardRequest {
  string id = 1;
  string name = 2;
  CardType type = 3;
  int32 cost = 4;
  optional int32 attack = 5;
  optional int32 defense = 6;
  string effect_text = 7;
  repeated Trait traits = 8;
  optional CardEffect card_effect = 9; // CardEffectModel構造を型安全に送信
}

// カード更新レスポンス
message UpdateCardResponse {
  Card card = 1;
}

// カード削除リクエスト
message DeleteCardRequest {
  string id = 1;
}

// カード削除レスポンス
message DeleteCardResponse {
  bool success = 1;
  string message = 2;
}

// デッキ作成リクエスト
message CreateDeckRequest {
  string name = 1;
  string description = 2;
  repeated string card_ids = 3;
}

// デッキ作成レスポンス
message CreateDeckResponse {
  Deck deck = 1;
}

// デッキ取得リクエスト
message GetDeckRequest {
  string id = 1;
}

// デッキ取得レスポンス
message GetDeckResponse {
  Deck deck = 1;
}

// デッキ一覧リクエスト
message ListDecksRequest {
  optional string user_id = 1; // 指定された場合、そのユーザーのデッキのみ取得
}

// デッキ一覧レスポンス
message ListDecksResponse {
  repeated Deck decks = 1;
}

// デッキ更新リクエスト
message UpdateDeckRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string card_ids = 4;
}

// デッキ更新レスポンス
message UpdateDeckResponse {
  Deck deck = 1;
}

// デッキ削除リクエスト
message DeleteDeckRequest {
  string id = 1;
}

// デッキ削除レスポンス
message DeleteDeckResponse {
  bool success = 1;
  string message = 2;
}

